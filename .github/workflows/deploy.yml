name: Deploy CloudOps Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cloudops-enterprise-platform

            git fetch origin
            git reset --hard origin/main

            docker stop cloudops-app || true
            docker rm cloudops-app || true

            docker build --no-cache -t cloudops-app:latest .

            docker run -d \
              --name cloudops-app \
              -p 80:5000 \
              -e APP_VERSION="$(git rev-parse --short HEAD)" \
              -e GIT_COMMIT="$(git rev-parse --short HEAD)" \
              -e DEPLOYED_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
              -e APP_ENV="production" \
              cloudops-app:latest